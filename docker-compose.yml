services:
  postgres:
    image: postgres:16-alpine
    container_name: aix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aix
      POSTGRES_PASSWORD: aix
      POSTGRES_DB: ai_unlimited
    ports:
      - "5432:5432"
    volumes:
      - aix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aix -d ai_unlimited"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Development: hot-reload Next.js, source bind-mounted from host ----
  # Run with:  docker compose --profile dev up --build
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aix-app-dev
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: postgresql://aix:aix@postgres:5432/ai_unlimited?schema=public
      NEXTAUTH_URL: http://localhost:3005
      NODE_ENV: development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Production: built standalone image, no host mounts ----
  # Run with:  docker compose --profile prod up --build -d
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    image: aix-app:latest
    container_name: aix-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://aix:aix@postgres:5432/ai_unlimited?schema=public
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aix-pgdata:
